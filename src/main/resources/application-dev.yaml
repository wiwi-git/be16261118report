# dev 환경: MySQL 사용
# DB 접속 정보는 프로젝트 루트의 .env 파일에서 읽는다. (.env는 git에 올리지 않음, 형식은 .env.example 참고)
# ENV_FILE로 다른 경로의 .env 파일을 지정할 수 있다. (기본값: .env)
spring:
  config:
    import: optional:file:${ENV_FILE:.env}[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
