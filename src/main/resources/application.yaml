spring:
  application:
    name: be16261118report
  profiles:
    # 기본 실행 환경은 dev, 테스트는 @ActiveProfiles("test")로 test 환경을 사용한다.
    default: dev
  jpa:
    # 뷰 렌더링까지 영속성 컨텍스트를 열어두지 않는다. (트랜잭션은 서비스/컨트롤러에서 명시)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
